name: Build e Release APK Android

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Criar uma nova Release no GitHub com o APK'
        required: true
        type: boolean
        default: true
      version_tag:
        description: 'Nome da tag da release (ex: v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Gerar APK Release Android
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Aceitar Licenças do Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🟢 Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm install --prefer-offline --no-audit

      - name: ⚙️ Executar Expo Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: 🐘 Configurar Cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔨 Compilar APK Release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x test

      - name: 📂 Preparar Artefato do APK
        id: prepare_apk
        run: |
          mkdir -p dist-apk
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ Erro: APK não encontrado em android/app/build/outputs/apk/release/"
            exit 1
          fi

          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == "main" || -z "$VERSION" ]]; then
            VERSION="${{ github.event.inputs.version_tag || 'v1.0.0' }}"
          fi

          OUTPUT_NAME="SimulaDetran-${VERSION}.apk"
          cp "$APK_PATH" "dist-apk/${OUTPUT_NAME}"
          echo "apk_path=dist-apk/${OUTPUT_NAME}" >> $GITHUB_OUTPUT
          echo "apk_name=${OUTPUT_NAME}" >> $GITHUB_OUTPUT
          echo "release_tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "✅ APK preparado com sucesso: dist-apk/${OUTPUT_NAME}"
          ls -lh dist-apk/

      - name: 📤 Upload do APK como Artefato do Workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_apk.outputs.apk_name }}
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          retention-days: 30

      - name: 🚀 Publicar no GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.release_tag }}
          name: SimulaDetran ${{ steps.prepare_apk.outputs.release_tag }}
          body: |
            ## 📱 SimulaDetran — Simulador Prático do Exame de Direção (DETRAN)
            
            Versão oficial pronta para instalação em dispositivos Android.
            
            ### 🚀 Recursos:
            - **Resolução Contran nº 1.020/2025** e **MBEDV 2026** implementadas.
            - **Perfil Maranhão (MA)** como padrão inicial (Portaria Detran-MA nº 127/2026).
            - **Modo 100% Offline-First** com banco local SQLite + Drizzle ORM.
            - **Lançamento de infrações com 1 toque** projetado para uso com uma mão dentro do veículo.
            - **Undo instantâneo** para reversão atômica de lançamentos errôneos.
            - **Geração e Compartilhamento de Relatório PDF** via WhatsApp.
            - **Acompanhamento de Evolução do Aluno** e Top 3 faltas mais frequentes.
            
            ### 📥 Como Instalar:
            1. Baixe o arquivo `${{ steps.prepare_apk.outputs.apk_name }}` abaixo no seu celular.
            2. Toque no arquivo baixado para instalar (autorize fontes desconhecidas se solicitado).
            3. Abra o app e comece a aplicar simulados imediatamente!
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
